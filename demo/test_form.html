<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Formulaire de test</title>
<style>
  body { font-family: sans-serif; max-width: 480px; margin: 40px auto; }
  label { display: block; margin-top: 16px; }
  input { width: 100%; padding: 8px; font-size: 16px; }
  button { margin-top: 24px; padding: 10px 20px; font-size: 16px; }
</style>
</head>
<body>
<h1>Demande administrative (test)</h1>
<form id="f" onsubmit="document.getElementById('ok').hidden = false; return false;">
  <label>Nom <input name="nom"></label>
  <label>Prénom <input name="prenom"></label>
  <label>Adresse <input name="adresse"></label>
  <label>Email <input name="email" type="email"></label>
  <button type="submit">Envoyer</button>
</form>
<p id="ok" hidden>Demande envoyée.</p>
</body>
</html>
